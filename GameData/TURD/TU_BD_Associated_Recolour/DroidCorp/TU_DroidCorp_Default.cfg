

@PART[dcm_suu23,dcm_m61vulcan]:FOR[004_BD_Switching]:NEEDS[TexturesUnlimited&BDArmory&DroidCorpMunitions]
{
	MODULE
	{
		name = KSPTextureSwitch
		sectionName = Appearance
		currentTextureSet = DroidCorpMunitions_M61_Default
		textureSet = DroidCorpMunitions_M61_Default
	}
}
+KSP_TEXTURE_SET[Stock_Default]:NEEDS[TexturesUnlimited]
{
	@name = DroidCorpMunitions_M61_Default
	@MATERIAL
	{
		@shader = KSP/Diffuse
		mesh = SUU-23A_body-
		mesh = M61_Shroud

		texture = _MainTex,DroidCorpMunitions/SharedTextures/TexAtlas_M61
		texture = _BumpMap,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Bump
		texture = _Emissive,TURD/TU_Standardised_Switching/000_PlaceholderTextures/Emis
	}
}

